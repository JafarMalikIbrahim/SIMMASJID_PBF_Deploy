steps:

  # Step 0: Install mysqli (php-mysql) package dengan penanganan dpkg lock
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute ssh deploy-webmasjid --zone=asia-east1-c --command='
          echo "Menunggu dpkg lock release...";
          while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 5; done;
          sudo apt-get update &&
          sudo apt-get install -y apache2 mysql-server php-mysql &&
          sudo systemctl restart apache2
        '

  # Step 1: Git pull
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'compute'
      - 'ssh'
      - 'deploy-webmasjid'
      - '--zone=asia-east1-c'
      - '--command=cd /var/www/html/SIMMASJID_PBF_Deploy && git pull origin Optimization'

  # Step 2: Install dependency dan artisan commands
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'compute'
      - 'ssh'
      - 'deploy-webmasjid'
      - '--zone=asia-east1-c'
      - '--command=cd /var/www/html/SIMMASJID_PBF_Deploy && composer install --no-interaction --prefer-dist && php artisan migrate --force && php artisan config:cache && php artisan storage:link'

# Logging dan timeout
options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
